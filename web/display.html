<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papan Informasi</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Skala mengikuti lebar layar: 1920px = 16px. Semua ukuran di halaman ini memakai rem. */
    html { font-size: clamp(12px, .8334vw, 44px); }
    html, body { height: 100%; overflow: hidden; }
    body { font-size: 1rem; background: var(--bg); }

    .board { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 1.25rem; padding: 1.25rem 1.75rem; }

    /* Header */
    .head { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 1.5rem; padding: .85rem 1.4rem; box-shadow: var(--shadow-sm); }
    .brand { display: flex; align-items: center; gap: 1rem; min-width: 0; }
    .brand img { height: 3.6rem; width: auto; max-width: 11rem; object-fit: contain; }
    .brand .nm { font-size: 1.85rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
    .brand .sc { font-size: 1rem; color: var(--muted); margin-top: .2rem; }
    .clock { display: flex; align-items: center; gap: 1rem; }
    .clock .t { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    .clock .d { font-size: 1rem; color: var(--ink-2); text-align: right; }
    .clock .chip-t { background: var(--blue-50); color: var(--blue-700); border-radius: 1rem; padding: .55rem 1rem; display: flex; align-items: center; gap: .7rem; }
    .clock .chip-t .ic { width: 1.5rem; height: 1.5rem; }

    /* Badan */
    .body { display: grid; grid-template-columns: minmax(0, 1fr) 29rem; gap: 1.25rem; min-height: 0; }
    .stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: .8rem; min-height: 0; }

    .slide { container-type: size; position: relative; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 1.6rem; box-shadow: var(--shadow); overflow: hidden; display: flex; align-items: center; justify-content: center; animation: rise .5s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(.5rem); } to { opacity: 1; transform: none; } }
    .slide .fill { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .slide img, .slide video { width: 100%; height: 100%; object-fit: contain; background: #0c1b34; }
    .slide img.soft { background: var(--blue-50); }
    .slide iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    .slide canvas { max-width: 100%; max-height: 100%; background: #fff; box-shadow: var(--shadow-lg); border-radius: .3rem; }
    /* Ruang di atas untuk pil hitung mundur agar tidak menutupi halaman. */
    .slide .pdfbg { background: var(--blue-50); padding: 3.8rem 1.2rem 1.2rem; }
    .slide-empty { color: var(--muted); font-size: 1.5rem; }

    /* Ukuran teks mengikuti panggung (satuan kontainer) agar mengisi ruang di 1366x768 sampai 4K.
       --fit (diatur skrip) memperkecil teks panjang sampai muat. */
    .slide-text { --fit: 1; width: min(86%, 110rem); max-height: 100%; overflow: hidden; padding: 4cqmin; text-align: center; }
    .slide-text .bar { width: clamp(4rem, 9cqmin, 9rem); height: clamp(.3rem, .8cqmin, .7rem); border-radius: 1rem; background: var(--yellow); margin: 0 auto 4cqmin; }
    .slide-text h2 { font-size: calc(clamp(2.6rem, 9cqmin, 10rem) * var(--fit)); line-height: 1.1; letter-spacing: -.02em; color: var(--blue-700); margin-bottom: 3cqmin; text-wrap: balance; }
    .md { font-size: calc(clamp(1.5rem, 4.4cqmin, 5rem) * var(--fit)); line-height: 1.45; color: var(--ink); text-wrap: pretty; }
    .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
    .md p { margin: 0 0 .6em; }
    .md h1, .md h2, .md h3, .md h4 { color: var(--blue-700); line-height: 1.15; margin: .8em 0 .35em; }
    .md h1 { font-size: 1.5em; } .md h2 { font-size: 1.3em; } .md h3 { font-size: 1.15em; } .md h4 { font-size: 1em; }
    .md ul, .md ol { text-align: left; display: inline-block; margin: 0 0 .6em; padding-left: 1.3em; }
    .md li { margin: .2em 0; }
    .md blockquote { margin: .6em auto; padding: .2em 1em; border-left: .25em solid var(--yellow); background: var(--blue-50); border-radius: .4em; text-align: left; width: fit-content; max-width: 100%; }
    .md hr { border: 0; height: .15em; background: var(--line-strong); margin: .8em auto; width: 40%; }
    .md code { font-family: ui-monospace, Menlo, monospace; background: var(--blue-50); padding: .05em .3em; border-radius: .3em; }

    .slide .cd { position: absolute; left: 1.2rem; top: 1.2rem; z-index: 3; }
    /* Di atas latar terang pil perlu solid; versi transparan hanya cocok di atas kartu biru. */
    .slide .cd .hero-pill { background: var(--ink); box-shadow: var(--shadow); }
    .slide .ttl { position: absolute; right: 1.2rem; top: 1.2rem; z-index: 3; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 999px; padding: .45rem 1rem; font-size: .95rem; font-weight: 600; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-pill { font-size: 1rem; padding: .45rem 1rem; }
    .hero-pill .ic { width: 1.1rem; height: 1.1rem; }

    /* Penanda progres tayangan: satu garis segmen tipis di bawah panggung, tanpa kartu. */
    .tracker { display: flex; align-items: center; gap: .9rem; padding: 0 .4rem; }
    .tracker .lbl { order: 2; flex: none; font-size: .85rem; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .tracker .lbl > span:first-child { display: none; }
    .tracker .segs { order: 1; flex: 1; display: flex; gap: .35rem; }
    .seg { position: relative; flex: 1; height: .45rem; border-radius: 1rem; background: var(--blue-100); overflow: hidden; }
    .seg > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1rem; background: var(--blue); width: 0; }
    .seg.done > i { width: 100%; }
    .seg .bubble { display: none; }

    /* Panel antrian */
    .queue { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 1rem; min-height: 0; }
    .calling { padding: 1.4rem 1.5rem; }
    .calling .top { display: flex; justify-content: space-between; align-items: center; gap: .8rem; margin-bottom: 1rem; }
    .calling .eyebrow { font-size: 1.05rem; }
    .calling .big { font-size: 7.2rem; margin: .2rem 0 .6rem; }
    .calling .big.idle { font-size: 4rem; opacity: .85; }
    .calling .where { font-size: 1.5rem; font-weight: 600; }
    .calling .hero-stats { margin-top: 1.2rem; grid-template-columns: 1fr 1fr; }
    .calling .hero-stat { flex-direction: column; align-items: flex-start; gap: .1rem; padding: .8rem 1rem; }
    .calling .hero-stat .k { font-size: .95rem; }
    .calling .hero-stat .v { font-size: 2rem; }
    .calling.flash { animation: pulse 1.2s ease 2; }
    @keyframes pulse { 0%,100% { box-shadow: var(--shadow); } 50% { box-shadow: 0 0 0 .5rem rgba(255,197,46,.55), var(--shadow); } }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 1.4rem; padding: 1.1rem 1.25rem; box-shadow: var(--shadow-sm); min-height: 0; overflow: hidden; }
    .panel h3 { font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: .8rem; }
    /* Kartu meja mengisi seluruh sisa tinggi kolom; baris berbagi tinggi merata sehingga tidak ada yang terpotong. */
    .desks { display: flex; flex-direction: column; }
    .counters { flex: 1; min-height: 0; display: grid; gap: .6rem; grid-auto-rows: minmax(0, 5.6rem); align-content: start; }
    .counters.two { grid-template-columns: 1fr 1fr; }
    .ctr { display: flex; align-items: center; gap: .7rem; padding: .5rem .8rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--soft); min-width: 0; min-height: 0; overflow: hidden; }
    .ctr .av { width: 2.6rem; height: 2.6rem; border-radius: .8rem; display: grid; place-items: center; background: var(--blue-100); color: var(--blue-700); font-weight: 800; font-size: 1.05rem; flex: none; }
    .ctr.busy .av { background: var(--blue); color: #fff; }
    .ctr .grow { min-width: 0; flex: 1; }
    .ctr .nm { font-weight: 700; font-size: 1.1rem; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctr .sb { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctr .rt { margin-left: auto; text-align: right; display: grid; gap: .2rem; justify-items: end; flex: none; }
    .ctr .lb { font-weight: 800; font-size: 1.3rem; color: var(--blue-700); font-variant-numeric: tabular-nums; line-height: 1; }
    .pill { font-size: .8rem; }
    /* Dua kolom (5-10 meja): nomor dan status dipindah ke bawah nama supaya nama meja tidak terpotong. */
    .counters.two:not(.dense) .ctr { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "av g" "av r"; column-gap: .7rem; row-gap: .25rem; align-content: center; }
    .counters.two:not(.dense) .av { grid-area: av; }
    .counters.two:not(.dense) .grow { grid-area: g; }
    .counters.two:not(.dense) .rt { grid-area: r; margin: 0; display: flex; align-items: center; gap: .5rem; justify-items: start; text-align: left; }
    .counters.two:not(.dense) { grid-auto-rows: minmax(0, 6.8rem); }
    .counters.two:not(.dense) .rt { flex-wrap: nowrap; }
    .counters.two:not(.dense) .pill.busy { display: none; } /* nomor yang sedang dilayani sudah menandai meja terisi */
    .counters.dense { gap: .4rem; }
    /* Padat (> 10 meja): status hanya titik/nomor, nama tetap terbaca penuh. */
    .counters.dense .pill .t { display: none; }
    .counters.dense .pill.busy { display: none; }
    .counters.dense .pill.ok { padding: .25rem; }
    .counters.dense .ctr { padding: .3rem .6rem; gap: .5rem; }
    .counters.dense .av { width: 2rem; height: 2rem; font-size: .9rem; border-radius: .6rem; }
    .counters.dense .nm { font-size: .95rem; }
    .counters.dense .sb { display: none; }
    .counters.dense .lb { font-size: 1.05rem; }

    /* Panggilan terakhir: satu baris chip di dasar kartu meja */
    .recent { flex: none; display: flex; align-items: center; gap: .7rem; margin-top: .8rem; padding-top: .8rem; border-top: 1px dashed var(--line-strong); min-height: 2.6rem; overflow: hidden; }
    .recent .lbl { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; flex: none; }
    .recent .items { display: flex; gap: .5rem; overflow: hidden; white-space: nowrap; min-width: 0; }
    .rc { display: inline-flex; align-items: center; gap: .4rem; border: 1px solid var(--line-strong); border-radius: .8rem; padding: .25rem .65rem; font-size: .9rem; background: var(--soft); }
    .rc b { color: var(--blue-700); font-variant-numeric: tabular-nums; }

    /* Screensaver */
    .saver { position: fixed; inset: 0; background: #0c1b34; z-index: 20; animation: rise .8s ease; }
    .saver video, .saver img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .saver .glass { position: absolute; left: 2rem; bottom: 2rem; display: flex; align-items: center; gap: 1rem; background: rgba(255,255,255,.92); border-radius: 1.2rem; padding: .8rem 1.3rem; font-weight: 700; font-size: 1.3rem; box-shadow: var(--shadow-lg); }
    .saver .glass img { position: static; width: auto; height: 2.6rem; object-fit: contain; background: none; }
    .saver .clk { position: absolute; right: 2rem; bottom: 2rem; background: rgba(15,31,58,.7); color: #fff; border-radius: 1.2rem; padding: .6rem 1.3rem; font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }

    .unlock { position: fixed; inset: 0; z-index: 30; background: rgba(15,42,107,.94); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; text-align: center; padding: 2rem; }
    .unlock h2 { font-size: 2.4rem; }
    .unlock p { margin: 0; opacity: .92; font-size: 1.2rem; }
    .unlock .btn { font-size: 1.3rem; padding: 1rem 2.2rem; border-radius: 1rem; }
    .offline { position: fixed; top: .8rem; left: 50%; transform: translateX(-50%); z-index: 25; background: var(--red); color: #fff; padding: .45rem 1rem; border-radius: 999px; font-size: .95rem; font-weight: 600; box-shadow: var(--shadow-lg); }
  </style>
</head>
<body>
  <div class="board" id="board">
    <header class="head">
      <div class="brand">
        <img id="logo" alt="" class="hidden">
        <div>
          <div class="nm" id="orgName">Nama Instansi</div>
          <div class="sc hidden" id="screenName"></div>
        </div>
      </div>
      <div class="clock">
        <div class="d" id="date">&nbsp;</div>
        <div class="chip-t">
          <span id="clockIc"></span>
          <span class="t" id="clock">--:--:--</span>
        </div>
      </div>
    </header>

    <main class="body">
      <section class="stage">
        <div class="slide" id="slide"><div class="slide-empty">Belum ada informasi</div></div>
        <div class="tracker" id="trackerBox">
          <div class="lbl"><span>Tayangan</span><span id="trackerCount"></span></div>
          <div class="segs" id="tracker"></div>
        </div>
      </section>

      <aside class="queue">
        <div class="hero calling" id="nowPanel">
          <div class="top">
            <span class="eyebrow">Sedang dipanggil</span>
            <span class="hero-pill hidden" id="nowPill"></span>
          </div>
          <div id="nowBody"><div class="big idle num">&mdash;</div><div class="where">Menunggu panggilan berikutnya</div></div>
          <div class="hero-stats">
            <div class="hero-stat"><span class="k">Menunggu</span><span class="v" id="statWaiting">0</span></div>
            <div class="hero-stat"><span class="k">Sedang dilayani</span><span class="v" id="statServing">0</span></div>
          </div>
        </div>

        <div class="panel desks">
          <h3>Meja layanan</h3>
          <div class="counters" id="counters"></div>
          <div class="recent">
            <span class="lbl">Terakhir</span>
            <div class="items" id="recent"></div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div class="saver hidden" id="saver"></div>
  <div class="offline hidden" id="offline" role="status">Koneksi ke server terputus, mencoba lagi…</div>

  <div class="unlock" id="unlock">
    <h2>Papan Informasi</h2>
    <p>Ketuk layar untuk mengaktifkan bunyi dan suara panggilan antrian.</p>
    <button class="btn btn-accent" id="unlockBtn">Aktifkan</button>
  </div>

  <script type="module" src="/js/display.js"></script>
</body>
</html>
