# Contoh nginx sebagai reverse proxy. Simpan sebagai /etc/nginx/sites-available/papan-informasi
# lalu aktifkan dengan tautan ke sites-enabled.
# CATATAN: contoh ini belum diuji di lingkungan pengembangan (nginx tidak terpasang di sana).
#
# Di berkas /etc/papan-informasi.env set: HOST=127.0.0.1 dan TRUST_PROXY=1
# Sertifikat: gunakan certbot (Let's Encrypt) atau sertifikat dari CA instansi.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name antrian.instansi.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name antrian.instansi.go.id;

    ssl_certificate     /etc/letsencrypt/live/antrian.instansi.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antrian.instansi.go.id/privkey.pem;

    # Batas unggahan sedikit di atas batas aplikasi (300 MB).
    client_max_body_size 310m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Alamat klien asli dan skema: dipakai pembatas login (TRUST_PROXY=1) dan penanda cookie Secure.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # timpa, jangan tambahkan, agar klien tidak bisa memalsukannya
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (/ws): koneksi panjang, server mengirim ping tiap 30 detik.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;

        # Unggahan besar langsung diteruskan tanpa ditampung di disk proxy.
        proxy_request_buffering off;
    }
}
