<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambil Nomor Antrian</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    html, body { height: 100%; }
    body { background: linear-gradient(180deg, #ffffff, var(--bg)); }
    .kiosk { min-height: 100vh; display: flex; flex-direction: column; }
    .kiosk-head { background: var(--blue); color: #fff; padding: 22px 24px; border-bottom: 6px solid var(--yellow); text-align: center; }
    .kiosk-head h1 { margin: 0; font-size: clamp(24px, 4vw, 40px); }
    .kiosk-head p { margin: 6px 0 0; opacity: .9; font-size: clamp(14px, 2vw, 18px); }
    .cats { flex: 1; display: grid; gap: 18px; padding: 24px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-content: center; }
    .cat {
      appearance: none; border: 1px solid var(--line); background: #fff; border-radius: 22px; box-shadow: var(--shadow);
      padding: 28px 22px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 14px; min-height: 180px;
      transition: transform .1s ease, border-color .2s ease;
    }
    .cat:hover { border-color: var(--yellow); }
    .cat:active { transform: scale(.98); }
    .cat .code {
      width: 64px; height: 64px; border-radius: 18px; background: var(--yellow); color: var(--ink);
      display: grid; place-items: center; font-size: 30px; font-weight: 800;
    }
    .cat .name { font-size: clamp(20px, 2.6vw, 28px); font-weight: 700; color: var(--blue); }
    .cat .hint { color: var(--muted); font-size: 16px; margin-top: auto; }
    .ticket {
      position: fixed; inset: 0; background: rgba(11,79,158,.94); color: #fff; z-index: 40;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .ticket .card-t {
      background: #fff; color: var(--ink); border-radius: 24px; padding: 32px 36px; text-align: center; width: min(520px, 100%);
      border-top: 10px solid var(--yellow); box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .ticket .lbl { color: var(--muted); font-size: 18px; font-weight: 600; }
    .ticket .num { font-size: clamp(64px, 14vw, 120px); font-weight: 800; color: var(--blue); line-height: 1.05; font-variant-numeric: tabular-nums; }
    .ticket .when { font-size: 16px; color: var(--muted); margin-top: 6px; }
    .ticket .thanks { margin-top: 18px; font-size: 18px; }
  </style>
</head>
<body>
  <div class="kiosk">
    <header class="kiosk-head">
      <h1 id="orgName">Ambil Nomor Antrian</h1>
      <p>Pilih layanan yang Anda butuhkan</p>
    </header>
    <main class="cats" id="cats">
      <div class="muted" style="grid-column:1/-1;text-align:center">Memuat layanan…</div>
    </main>
  </div>

  <div class="ticket hidden" id="ticket" role="dialog" aria-live="polite">
    <div class="card-t">
      <div class="lbl" id="tCat"></div>
      <div class="num" id="tNum"></div>
      <div class="when" id="tWhen"></div>
      <div class="thanks">Silakan menunggu hingga nomor Anda dipanggil.</div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    (function () {
      const P = window.Papan;
      let settings = {};
      let busy = false;
      let hideTimer = null;

      async function loadSettings() {
        try {
          settings = await P.api('/api/settings');
          document.getElementById('orgName').textContent = settings.org_name || 'Ambil Nomor Antrian';
          document.title = 'Ambil Nomor · ' + (settings.org_name || '');
        } catch { /* biarkan default */ }
      }

      async function loadCats() {
        const cats = await P.api('/api/categories');
        const box = document.getElementById('cats');
        box.innerHTML = '';
        if (!cats.length) {
          box.innerHTML = '<div class="muted" style="grid-column:1/-1;text-align:center">Belum ada layanan.</div>';
          return;
        }
        for (const c of cats) {
          const b = document.createElement('button');
          b.className = 'cat';
          b.innerHTML =
            '<span class="code">' + P.esc(c.prefix) + '</span>' +
            '<span class="name">' + P.esc(c.name) + '</span>' +
            '<span class="hint">Ketuk untuk mengambil nomor</span>';
          b.addEventListener('click', () => take(c, b));
          box.appendChild(b);
        }
      }

      async function take(cat, btn) {
        if (busy) return;
        busy = true;
        btn.disabled = true;
        try {
          const t = await P.api('/api/tickets', { method: 'POST', body: { categoryId: cat.id } });
          const now = new Date();
          document.getElementById('tCat').textContent = cat.name;
          document.getElementById('tNum').textContent = t.label;
          document.getElementById('tWhen').textContent = P.fmtDate(now.getTime(), settings.timezone || 'Asia/Jakarta') +
            ' · ' + P.fmtTime(now.getTime(), settings.timezone || 'Asia/Jakarta');
          document.getElementById('ticket').classList.remove('hidden');
          if (settings.sound_enabled !== '0') P.chime();
          clearTimeout(hideTimer);
          hideTimer = setTimeout(close, 6000);
        } catch (e) {
          P.toast(e.message || 'Gagal mengambil nomor');
        } finally {
          btn.disabled = false;
          busy = false;
        }
      }

      function close() {
        document.getElementById('ticket').classList.add('hidden');
      }
      document.getElementById('ticket').addEventListener('click', close);

      loadSettings();
      loadCats().catch(() => P.toast('Gagal memuat layanan'));
      P.connectWS((msg) => {
        if (msg.type === 'settings') loadSettings();
        if (msg.type === 'categories') loadCats().catch(() => {});
      });
    })();
  </script>
</body>
</html>
