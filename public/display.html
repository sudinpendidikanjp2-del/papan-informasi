<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papan Informasi</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    html, body { overflow: hidden; background: var(--bg); }
    .display {
      height: 100vh; display: grid;
      grid-template-rows: auto 1fr auto;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
    }

    /* Header */
    .head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; background: var(--blue); color: #fff;
      border-bottom: 6px solid var(--yellow);
    }
    .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .brand img { height: 64px; width: auto; max-width: 180px; object-fit: contain; background: #fff; border-radius: 12px; padding: 6px; }
    .brand .name { font-size: clamp(20px, 2.2vw, 34px); font-weight: 700; letter-spacing: .01em; line-height: 1.15; }
    .clock { text-align: right; }
    .clock .time { font-size: clamp(28px, 3vw, 48px); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--yellow); line-height: 1; }
    .clock .date { font-size: clamp(13px, 1.1vw, 17px); opacity: .92; margin-top: 4px; }

    /* Body */
    .body { display: grid; grid-template-columns: 1fr clamp(300px, 26vw, 420px); gap: 22px; padding: 22px 28px; min-height: 0; }

    .stage { position: relative; min-height: 0; display: flex; flex-direction: column; }
    .slide {
      flex: 1; min-height: 0; background: var(--card); border-radius: 22px;
      box-shadow: var(--shadow); border: 1px solid var(--line);
      overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;
      animation: fadeIn .6s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .slide-text { padding: clamp(24px, 4vw, 64px); max-width: 1100px; text-align: center; }
    .slide-text h2 { font-size: clamp(30px, 4vw, 60px); margin: 0 0 18px; color: var(--blue); line-height: 1.15; }
    .slide-text p { font-size: clamp(18px, 2.2vw, 32px); line-height: 1.5; margin: 0; white-space: pre-line; color: var(--ink); }
    .slide-text::before {
      content: ""; display: block; width: 96px; height: 6px; background: var(--yellow);
      border-radius: 6px; margin: 0 auto 26px;
    }
    .slide img, .slide video { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; background: #0b1a2e; }
    .slide iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    .empty { color: var(--muted); font-size: 22px; }

    .countdown {
      position: absolute; right: 16px; top: 16px; background: var(--blue); color: #fff;
      border-radius: 14px; padding: 8px 14px; font-weight: 700; font-variant-numeric: tabular-nums;
      font-size: 20px; box-shadow: var(--shadow); display: flex; gap: 8px; align-items: center;
    }
    .countdown::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); }
    .progress { height: 8px; background: var(--line); border-radius: 8px; margin-top: 12px; overflow: hidden; }
    .progress > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--yellow)); }

    /* Panel antrian */
    .queue { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 16px 18px; }
    .panel h3 { margin: 0 0 12px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .calling { background: var(--yellow); border-color: #f2b400; }
    .calling h3 { color: var(--ink); }
    .calling .now-label { font-size: clamp(40px, 5vw, 76px); font-weight: 800; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
    .calling .now-counter { font-size: clamp(18px, 1.8vw, 26px); font-weight: 600; margin-top: 6px; color: var(--ink); }
    .calling .idle-text { font-size: 20px; color: var(--ink); opacity: .75; }
    .counter-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
    .counter-row:last-child { border-bottom: 0; }
    .counter-row .cname { font-weight: 700; font-size: 17px; }
    .counter-row .csub { font-size: 13px; color: var(--muted); }
    .num { font-weight: 800; font-size: 22px; color: var(--blue); font-variant-numeric: tabular-nums; }
    .badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
    .badge.free { background: #e4f6ea; color: #1e7a3c; }
    .badge.busy { background: var(--blue-soft); color: var(--blue); }
    .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 16px; }
    .cat-row:last-child { border-bottom: 0; }
    .cat-row b { color: var(--blue); font-variant-numeric: tabular-nums; font-size: 20px; }

    /* Footer */
    .foot {
      background: var(--blue-deep); color: #fff; display: flex; align-items: center; gap: 16px;
      padding: 10px 28px; font-size: 16px; overflow: hidden; white-space: nowrap;
    }
    .foot .label { background: var(--yellow); color: var(--ink); font-weight: 800; padding: 6px 12px; border-radius: 8px; flex: none; }
    .foot .items { display: flex; gap: 28px; overflow: hidden; }
    .foot .items span b { color: var(--yellow); font-variant-numeric: tabular-nums; }

    /* Screensaver & aktivasi suara */
    .screensaver {
      position: fixed; inset: 0; background: #0b1a2e; z-index: 20; display: flex; align-items: center; justify-content: center;
      animation: fadeIn .8s ease;
    }
    .screensaver video, .screensaver img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .screensaver .ss-badge {
      position: absolute; left: 24px; bottom: 24px; background: rgba(255,255,255,.92); color: var(--ink);
      padding: 10px 16px; border-radius: 14px; display: flex; gap: 12px; align-items: center; font-weight: 700;
    }
    .screensaver .ss-badge img { height: 40px; }
    .screensaver .ss-clock { position: absolute; right: 24px; bottom: 24px; color: #fff; font-size: 44px; font-weight: 700; text-shadow: 0 2px 12px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }

    .unlock {
      position: fixed; inset: 0; z-index: 30; background: rgba(11,79,158,.92); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
    }
    .unlock h2 { margin: 0; font-size: 32px; }
    .unlock p { margin: 0; opacity: .9; }
    .offline {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 25; background: #c0392b; color: #fff;
      padding: 6px 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="display" id="display">
    <header class="head">
      <div class="brand">
        <img id="logo" alt="Logo" class="hidden">
        <div class="name" id="orgName">Nama Instansi</div>
      </div>
      <div class="clock">
        <div class="time" id="clock">--:--:--</div>
        <div class="date" id="date">&nbsp;</div>
      </div>
    </header>

    <main class="body">
      <section class="stage">
        <div class="slide" id="slide"><div class="empty">Belum ada informasi</div></div>
      </section>

      <aside class="queue">
        <div class="panel calling" id="nowPanel">
          <h3>Sedang dipanggil</h3>
          <div id="nowBody"><div class="idle-text">Menunggu panggilan</div></div>
        </div>
        <div class="panel" style="min-height:0; overflow:hidden; flex:1">
          <h3>Meja layanan</h3>
          <div id="counters"></div>
        </div>
        <div class="panel">
          <h3>Antrian menunggu</h3>
          <div id="cats"></div>
        </div>
      </aside>
    </main>

    <footer class="foot">
      <span class="label">Panggilan terakhir</span>
      <div class="items" id="recent"></div>
    </footer>
  </div>

  <div class="screensaver hidden" id="saver"></div>
  <div class="offline hidden" id="offline">Koneksi ke server terputus, mencoba lagi…</div>

  <div class="unlock" id="unlock">
    <h2>Papan Informasi</h2>
    <p>Ketuk layar untuk mengaktifkan suara panggilan antrian.</p>
    <button class="btn btn-accent" id="unlockBtn" style="font-size:20px;padding:16px 28px">Aktifkan</button>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/display.js"></script>
</body>
</html>
